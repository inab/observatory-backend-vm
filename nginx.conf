events {}

http {


    # Needed for WebSocket/SSE (Prefect live updates)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }


    server {
        listen 80;

        # Global proxy timeout settings for all locations
        proxy_connect_timeout       120s;
        proxy_send_timeout          240s;
        proxy_read_timeout          240s;
        send_timeout                240s;


       
        location /api/ {
	    proxy_pass http://observatory-api:3500/;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	}
        

	location /licenses-mapping/ {
	    proxy_pass http://licenses-mapping:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
	}

        location /github-metadata-api/ {
            proxy_pass http://github-metadata-api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }
    }
}
