events {}

http {


    # Needed for WebSocket/SSE (Prefect live updates)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }


    server {
        listen 80;

        # Global proxy timeout settings for all locations
        proxy_connect_timeout       120s;
        proxy_send_timeout          240s;
        proxy_read_timeout          240s;
        send_timeout                240s;

         # --- Prefect UI + API at root ---
        location / {
            proxy_pass http://prefect-server:4200/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket/SSE upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Prefect streams can be long-lived
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/ {
            proxy_pass http://observatory-api:3500/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /github-metadata-api/ {
            proxy_pass http://github-metadata-api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }
    }
}
