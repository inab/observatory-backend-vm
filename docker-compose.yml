services:
  prefect-server:
    image: prefecthq/prefect:2-latest
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]  # UI+API on :4200
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api  # internal URL for agent/CLI
    volumes:
      - ./prefect_data:/root/.prefect
    restart: unless-stopped

  prefect-agent:
    image: prefecthq/prefect:2-latest
    depends_on:
      - prefect-server
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORK_QUEUE_NAME: default
    command: ["prefect", "agent", "start", "-q", "default"]
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"  # Expose Nginx on host port 8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - observatory-api
      - github-metadata-api
      - prefect-server
    restart: unless-stopped

  observatory-api:
    image: ghcr.io/inab/observatory-api:v2.6.0
    expose:
      - "3500"
    volumes:
      - ./observatory-api-variables/:/api-variables
    restart: unless-stopped

  github-metadata-api:
    image: ghcr.io/inab/github-metadata-api:v1.0.4
    expose:
      - "8080"
    volumes:
      - ./github-metadata-api-variables/:/app/variables
    restart: unless-stopped

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${MTU:-1442}

