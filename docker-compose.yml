services:

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"  # Expose Nginx on host port 8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    links:
      - observatory-api
      - licenses-mapping
      - github-metadata-api
    restart: unless-stopped

  observatory-api:
    image: ghcr.io/inab/observatory-api:v2.8.1
    volumes:
      - ./observatory-api-variables/:/api-variables
    restart: unless-stopped

  licenses-mapping:
    image: emartps/license-mapping-api:main
    volumes:
      - /home/user/.ssh/:/root/.ssh/
    env_file:
      - licenses-mapping-env/.env
    restart: unless-stopped

  github-metadata-api:
    image: ghcr.io/inab/github-metadata-api:v1.2.1
    volumes:
      - ./github-metadata-api-variables/:/app/variables
    restart: unless-stopped

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${MTU:-1442}

